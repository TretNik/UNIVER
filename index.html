<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вузы Иркутска</title>
    <link rel="icon" type="image/png" href="Img/Logo.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* ===== ОСНОВНЫЕ СТИЛИ (как были) ===== */
        :root {
            --bg-dark: #0b132b;
            --bg-card: #16213e;
            --accent: #0055a4;
            --accent-hover: #004483;
            --text-main: #eef2f7;
            --text-muted: #a0b0d0;
            --glow: 0 0 12px rgba(0, 85, 164, 0.4);
            --sidebar-width: 320px;
            --marker-bg: #afbfdb;
            --branch-bg: #cac3e6;
            --campus-bg: #99bed1;
            --border-color: #414d63;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }

        #map-container {
            position: absolute;
            top: 0;
            left: 0;
            right: var(--sidebar-width);
            bottom: 0;
            background: var(--bg-dark);
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
        }

        .leaflet-container {
            background: var(--bg-dark) !important;
        }

        .leaflet-tile-pane {
            filter: url(#dynamic-palette);
        }

        .leaflet-control-attribution {
            display: none !important;
        }

        .custom-zoom-control {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .custom-zoom-control:hover {
            border-color: var(--accent);
            box-shadow: var(--glow);
        }

        .custom-zoom-control .zoom-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            color: var(--text-main);
            border: none;
            cursor: pointer;
            font-size: 20px;
            font-weight: 700;
            transition: background 0.2s, color 0.2s;
            user-select: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .custom-zoom-control .zoom-btn:last-child {
            border-bottom: none;
        }

        .custom-zoom-control .zoom-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        .custom-zoom-control .zoom-btn:active {
            background: var(--accent-hover);
            transform: scale(0.95);
        }

        #sidebar {
            position: absolute;
            top: 0;
            right: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--bg-dark);
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            z-index: 1000;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sidebar h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            padding: 20px 16px 14px;
            border-bottom: 2px solid var(--accent);
            letter-spacing: 0.5px;
            text-shadow: 0 0 20px rgba(0, 85, 164, 0.2);
            flex-shrink: 0;
            margin: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to right, var(--bg-dark), #203d61);
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1 1 auto;
            min-width: 0;
        }

        .header-logo {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--bg-card);
            border: 1px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-logo .fallback-text {
            color: var(--text-main);
            font-weight: 700;
            font-size: 14px;
        }

        .header-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== БЛОК КОМАНДЫ (кликабельный) ===== */
        .header-right {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            padding: 4px 6px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .header-right:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .header-right .team-text {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            line-height: 1.2;
        }

        .header-right .team-sub {
            font-size: 9px;
            opacity: 0.5;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.2px;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        .header-right:hover .team-sub {
            opacity: 0.8;
        }

        .header-right .team-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-right .team-logo {
            width: 22px;
            height: 22px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--bg-card);
            border: 1px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-right .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-right .team-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.3px;
        }

        .header-right .it-highlight {
            color: #a8f5f7;
        }

        /* ===== ТУЛТИП ДЛЯ КОМАНДЫ ===== */
        .team-tooltip {
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.6rem;
            font-weight: 500;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            z-index: 5;
        }

        .team-tooltip::after {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid transparent;
            border-bottom-color: var(--bg-card);
        }

        .header-right:hover .team-tooltip {
            opacity: 1;
        }

        /* ===== МОДАЛЬНОЕ ОКНО КОМАНДЫ ===== */
        .modal-team {
            position: fixed;
            background: var(--bg-card);
            color: var(--text-main);
            border-radius: 18px;
            padding: 15px 18px 18px;
            width: 260px;
            max-width: 92vw;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), var(--glow);
            border: 1px solid rgba(255,255,255,0.05);
            z-index: 2000;
            display: none;
            animation: popIn 0.2s ease;
        }

        .modal-team h2 {
            margin: 0 0 9px 0;
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            border-bottom: 1.5px solid var(--accent);
            padding-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .modal-team .team-list {
            list-style: none;
            padding: 0;
            margin: 0 0 12px 0;
        }

        .modal-team .team-list li {
            padding: 4.5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .modal-team .team-list li:last-child {
            border-bottom: none;
        }

        .modal-team .team-list .name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .modal-team .team-list .role {
            background: rgba(0, 85, 164, 0.2);
            color: var(--accent);
            padding: 1.5px 7.5px;
            border-radius: 18px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            border: 1px solid rgba(0, 85, 164, 0.12);
            flex-shrink: 0;
            letter-spacing: 0.2px;
        }

        .modal-team .close-btn {
            display: block;
            margin: 0 auto;
            padding: 4.5px 21px;
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .modal-team .close-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(4px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .toggle-indicator {
            display: none;
            width: 14px;
            height: 5px;
            position: relative;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }

        .toggle-indicator::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 5px solid var(--text-muted);
            transition: transform 0.3s ease;
        }

        #uni-info-panel {
            position: relative;
            overflow: hidden;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            margin: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transition: opacity 0.4s ease, transform 0.4s ease;
            flex-shrink: 0;
        }

        #uni-info-panel .info-details a {
            color: #00BFFF !important;
            text-decoration: none;
        }
        #uni-info-panel .info-details a:hover {
            text-decoration: underline;
        }

        #uni-info-panel[class*="info-panel-"]::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            mask-image: linear-gradient(to bottom right, black 0%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom right, black 0%, transparent 100%);
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
        }

        #uni-info-panel > * {
            position: relative;
            z-index: 1;
        }

        .info-panel-igu::before { background-image: url('https://i.ibb.co/Xx1b1cMy/image.png'); }
        .info-panel-bgu::before { background-image: url('https://i.ibb.co/CpbGvvFD/image.png'); }
        .info-panel-irnitu::before { background-image: url('https://i.ibb.co/60BMtY3M/image.png'); }
        .info-panel-irgups::before { background-image: url('https://i.ibb.co/zTNHK71Q/image.png'); }
        .info-panel-vsi_mvd::before { background-image: url('https://i.ibb.co/v6b5tSPS/image.png'); }
        .info-panel-igmu::before { background-image: url('https://i.ibb.co/nMRHsMGf/image.png'); }
        .info-panel-vsiep::before { background-image: url('https://i.ibb.co/K1dtt49/image.png'); }
        .info-panel-rgup_filial::before { background-image: url('https://i.ibb.co/07gCbXt/image.png'); }
        .info-panel-vguu_filial::before { background-image: url('https://i.ibb.co/LGF2Lgv/image.png'); }
        .info-panel-vgik_filial::before { background-image: url('https://i.ibb.co/fRTVCwL/image.png'); }
        .info-panel-mgtu_ga_filial::before { background-image: url('https://i.ibb.co/BKSZ2BZW/image.png'); }
        .info-panel-rgufksmit_filial::before { background-image: url('https://i.ibb.co/SX1s3ktf/image.png'); }

        .info-placeholder {
            color: var(--text-muted);
            text-align: center;
            padding: 8px 0;
            font-size: 14px;
            opacity: 0.7;
        }

        .info-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .info-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--bg-dark);
            border: 2px solid var(--accent);
            box-shadow: 0 0 16px rgba(0, 85, 164, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .info-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .info-logo.logo-mgtu img {
            object-fit: contain;
            transform: scale(2.0);
        }

        .info-logo .fallback-text {
            color: var(--text-main);
            font-weight: 700;
            font-size: 12px;
            text-align: center;
            line-height: 1.1;
        }

        .info-title {
            flex: 1;
        }

        .info-title h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
            transition: color 0.3s ease;
        }

        .info-title .info-type {
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.8;
        }

        .info-details {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.8;
            margin-top: 4px;
        }

        .info-details .detail-row {
            display: flex;
            gap: 8px;
            padding: 2px 0;
        }

        .info-details .detail-row .label {
            font-weight: 600;
            color: var(--text-main);
            min-width: 70px;
            opacity: 0.8;
        }

        .info-details .detail-row .value {
            color: var(--text-muted);
        }

        .info-rating {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 6px;
        }

        .info-more-btn {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 8px;
            background: rgba(0, 85, 164, 0.2);
            color: var(--text-main);
            border: 1px solid var(--accent);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .info-more-btn:hover {
            background: var(--accent);
            box-shadow: var(--glow);
        }

        #search-container {
            padding: 0 16px 8px;
            flex-shrink: 0;
        }

        #search-input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            background-image: url('https://i.ibb.co/HfRHBQPh/image.png');
            background-repeat: no-repeat;
            background-position: 12px center;
            background-size: 18px 18px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #search-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        #search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 85, 164, 0.2);
        }

        #uni-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 12px;
        }

        #uni-list-container::-webkit-scrollbar {
            width: 4px;
        }

        #uni-list-container::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        #uni-list-container::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        .uni-item-wrapper {
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .uni-item-wrapper[class*="uni-bg-"]::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            mask-image: linear-gradient(to right, black 0%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, black 0%, transparent 100%);
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
        }

        .uni-item-wrapper > * {
            position: relative;
            z-index: 1;
        }

        .uni-bg-igu::before { background-image: url('https://i.ibb.co/Xx1b1cMy/image.png'); }
        .uni-bg-bgu::before { background-image: url('https://i.ibb.co/CpbGvvFD/image.png'); }
        .uni-bg-irnitu::before { background-image: url('https://i.ibb.co/60BMtY3M/image.png'); }
        .uni-bg-irgups::before { background-image: url('https://i.ibb.co/zTNHK71Q/image.png'); }
        .uni-bg-vsi_mvd::before { background-image: url('https://i.ibb.co/v6b5tSPS/image.png'); }
        .uni-bg-igmu::before { background-image: url('https://i.ibb.co/nMRHsMGf/image.png'); }
        .uni-bg-vsiep::before { background-image: url('https://i.ibb.co/K1dtt49/image.png'); }
        .uni-bg-rgup_filial::before { background-image: url('https://i.ibb.co/07gCbXt/image.png'); }
        .uni-bg-vguu_filial::before { background-image: url('https://i.ibb.co/LGF2Lgv/image.png'); }
        .uni-bg-vgik_filial::before { background-image: url('https://i.ibb.co/fRTVCwL/image.png'); }
        .uni-bg-mgtu_ga_filial::before { background-image: url('https://i.ibb.co/BKSZ2BZW/image.png'); }
        .uni-bg-rgufksmit_filial::before { background-image: url('https://i.ibb.co/SX1s3ktf/image.png'); }

        .uni-item-wrapper.hidden {
            display: none;
        }

        .uni-item-wrapper:hover {
            border-color: var(--accent);
            box-shadow: var(--glow);
            transform: translateY(-2px);
        }

        .uni-item-wrapper.active {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 85, 164, 0.5);
            background: rgba(0, 85, 164, 0.15);
        }

        .uni-item-wrapper.expanded {
            border-color: var(--accent);
            box-shadow: var(--glow);
        }

        .uni-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            cursor: pointer;
            color: var(--text-main);
            transition: background 0.2s;
        }

        .uni-item:hover {
            background: rgba(0, 85, 164, 0.1);
        }

        .uni-item .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--accent);
            box-shadow: 0 0 12px rgba(0, 85, 164, 0.2);
        }

        .uni-item .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .uni-item .logo-icon.logo-mgtu img {
            object-fit: contain;
            transform: scale(2.0);
        }

        .uni-item .logo-icon .fallback-text {
            color: var(--text-main);
            font-weight: 700;
            font-size: 10px;
            text-align: center;
            line-height: 1.1;
        }

        .uni-item .uni-name-text {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .uni-item .branch-badge {
            font-size: 10px;
            background: var(--accent);
            color: #fff;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        .uni-item .toggle-btn {
            font-size: 18px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 4px;
            user-select: none;
            transition: transform 0.3s ease, color 0.2s;
            opacity: 0.6;
        }

        .uni-item .toggle-btn:hover {
            opacity: 1;
            color: var(--text-main);
        }

        .uni-item-wrapper.expanded .toggle-btn {
            transform: rotate(90deg);
            color: var(--accent);
            opacity: 1;
        }

        .campus-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            background: rgba(11, 19, 43, 0.5);
            padding: 0 14px;
        }

        .uni-item-wrapper.expanded .campus-list {
            max-height: 600px;
            padding: 8px 14px 14px 14px;
        }

        .campus-list .campus-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;

            const initialStops = [

            ];

            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 0, b: 0 };
            }

            function interpolateColor(stop1, stop2, t) {
                const c1 = hexToRgb(stop1.color), c2 = hexToRgb(stop2.color);
                const r = c1.r + (c2.r - c1.r) * t,
                    g = c1.g + (c2.g - c1.g) * t,
                    b = c1.b + (c2.b - c1.b) * t;
                return '#' + [r, g, b].map(c => Math.round(c).toString(16).padStart(2, '0')).join('');
            }

            function getColorAt(pos, stops) {
                if (pos <= stops[0].pos) return stops[0].color;
                if (pos >= stops[stops.length - 1].pos) return stops[stops.length - 1].color;
                for (let i = 0; i < stops.length - 1; i++) {
                    const a = stops[i], b = stops[i + 1];
                    if (pos >= a.pos && pos <= b.pos) {
                        const t = (pos - a.pos) / (b.pos - a.pos);
                        return interpolateColor(a, b, t);
                    }
                }
                return stops[stops.length - 1].color;
            }

            function generateTableValues(stops, N = 32) {
                const values = [];
                for (let i = 0; i < N; i++) {
                    const pos = i / (N - 1);
                    const color = getColorAt(pos, stops);
                    values.push(hexToRgb(color));
                }
                return values;
            }

            function applyInitialGradient() {
                const stops = initialStops;
                const tableValues = generateTableValues(stops, 32);
                const filter = document.querySelector('#dynamic-palette');
                const feFuncR = filter.querySelector('feFuncR');
                const feFuncG = filter.querySelector('feFuncG');
                const feFuncB = filter.querySelector('feFuncB');
                feFuncR.setAttribute('tableValues', tableValues.map(v => v.r / 255).join(' '));
                feFuncG.setAttribute('tableValues', tableValues.map(v => v.g / 255).join(' '));
                feFuncB.setAttribute('tableValues', tableValues.map(v => v.b / 255).join(' '));
                const dark = stops[0].color;
                const main = stops[Math.floor(stops.length / 2)].color;
                const light = stops[stops.length - 1].color;
                return { dark, main, light };
            }

            function createCampusIcon(campusData) {
                const logos = campusData.subdivisions
                    .map(s => s.logo)
                    .filter(logo => logo && logo.trim() !== '');

                let displayItems = [];
                let extra = 0;
                if (logos.length === 0) {
                    displayItems = [{ type: 'dummy' }];
                } else {
                    const firstThree = logos.slice(0, 3);
                    extra = logos.length - 3;
                    firstThree.forEach(logoUrl => {
                        displayItems.push({ type: 'logo', url: logoUrl });
                    });
                    if (extra > 0) {
                        displayItems.push({ type: 'more', count: extra });
                    }
                }

                const isSingle = (displayItems.length === 1 && !(extra > 0));

                let iconsHtml = '';
                displayItems.forEach(item => {
                    if (item.type === 'logo') {
                        iconsHtml += `
                                <div class="campus-icon">
                                    <img src="${item.url}" alt="logo" crossorigin="anonymous"
                                         onerror="this.style.display='none';this.parentElement.querySelector('.fallback-text').style.display='block';">
                                    <span class="fallback-text" style="display:none;">🖼</span>
                                </div>
                            `;
                    } else if (item.type === 'more') {
                        iconsHtml += `<span class="more-indicator">+${item.count}</span>`;
                    } else if (item.type === 'dummy') {
                        iconsHtml += `<div class="campus-icon"><span class="fallback-text">📷</span></div>`;
                    }
                });

                const containerClass = isSingle ? 'campus-marker-custom single' : 'campus-marker-custom';
                let width = 0;
                if (isSingle) {
                    width = 28;
                } else {
                    const numIcons = displayItems.filter(i => i.type === 'logo' || i.type === 'dummy').length;
                    const moreExists = displayItems.some(i => i.type === 'more');
                    width = 8 + numIcons * 22 + (numIcons - 1) * 4;
                    if (moreExists) width += 16;
                    width = Math.max(width, 36);
                }
                const height = 28;

                const html = `
                        <div class="${containerClass}" style="width:${width}px; height:${height}px;">
                            ${iconsHtml}
                            <div class="arrow-down-small"></div>
                        </div>
                    `;

                return L.divIcon({
                    className: '',
                    iconSize: [width, height],
                    iconAnchor: [width / 2, height],
                    popupAnchor: [0, -height],
                    html: html
                });
            }

                }, 200);
            }

            function selectUniversity(uniId, options = {}) {
                const { focus = true } = options;
                selectedUniId = uniId;
                updateInfoPanel(uniId);
                if (focus) {
                    const marker = markers[uniId];
                    if (marker) {
                        const uni = universities.find(u => u.id === uniId);
                        setTimeout(() => {
                            focusMap(uni.lat, uni.lng, 16, function() {
                                marker.openPopup();
                            });
                        }, 150);
                    }
                }
            }

            // ---------- ИНИЦИАЛИЗАЦИЯ МАРКЕРОВ ----------
            function initMarkers(dark, main, light) {
                universities.forEach(uni => {
                    const icon = createCustomIcon(uni, dark, main, light);
                    const isBranch = uni.type === 'branch';
                    const marker = L.marker([uni.lat, uni.lng], { icon }).addTo(map)
                        .bindPopup(
                            `<b>${uni.name}</b><br><span style="color:${main};">${uni.address}</span>${isBranch ? '<br><span style="color:' + main + ';font-size:12px;">Филиал</span>' : ''}`
                        );
                    markers[uni.id] = marker;
                    marker.on('click', function() {
                        selectUniversity(uni.id);
                    });
                });

                const iguData = universities.find(u => u.id === 'igu');
                const campusGroup = L.layerGroup().addTo(map);
                campusMarkers['igu'] = campusGroup;
                if (iguData && iguData.campuses) {
                    iguData.campuses.forEach(c => {
                        let popupHtml = `<b>${c.name}</b><br><span style="color:#a8d8ea;">${c.address}</span>`;
                        if (c.subdivisions && c.subdivisions.length > 0) {
                            popupHtml +=
                                '<br><br><span style="font-weight:bold;color:#a8d8ea;">Подразделения:</span>';
                            c.subdivisions.forEach(sub => {
                                const logoHtml = sub.logo ?
                                    `<img src="${sub.logo}" alt="${sub.name}" style="width:24px;height:24px;border-radius:50%;object-fit:contain;background:#0a0f1a;border:1px solid #414d63;">` :
                                    `<span style="display:inline-block;width:24px;height:24px;"></span>`;
                                popupHtml += `<div style="display:flex;align-items:center;gap:8px;margin:4px 0;">
                                        ${logoHtml}
                                        <span style="color:#a8d8ea;">${sub.name}</span>
                                    </div>`;
                            });
                        }
                        const icon = createCampusIcon(c);
                        const marker = L.marker([c.lat, c.lng], { icon })
                            .bindPopup(popupHtml);
                        campusGroup.addLayer(marker);
                        const key = c.lat.toFixed(6) + ',' + c.lng.toFixed(6);
                        campusMarkersMap[key] = marker;
                    });
                    map.removeLayer(campusGroup);
                }
            }

            function focusCampus(campus) {
                selectUniversity('igu', { focus: false });
                const key = campus.lat.toFixed(6) + ',' + campus.lng.toFixed(6);
                const marker = campusMarkersMap[key];
                if (marker) {
                    setTimeout(() => {
                        focusMap(campus.lat, campus.lng, 17, function() {
                            marker.openPopup();
                        });
                    }, 150);
                }
            }

            // ---------- ПОСТРОЕНИЕ СПИСКА ----------
            const uniList = document.getElementById('uni-list');

            universities.forEach(uni => {
                const wrapper = document.createElement('div');
                wrapper.className = 'uni-item-wrapper';
                if (bgIds.includes(uni.id)) {
                    wrapper.classList.add('uni-bg-' + uni.id);
                }
                uniWrappers.push({ wrapper, uni });

                const header = document.createElement('div');
                header.className = 'uni-item';

                const shortLabel = uni.label || uni.name.split('(')[0].trim();
                const logoClass = (uni.id === 'mgtu_ga_filial') ? ' logo-mgtu' : '';
                let logoHtml = `<span class="fallback-text">${shortLabel}</span>`;
                if (uni.logo) {
                    logoHtml =
                        `<img src="${uni.logo}" alt="${uni.label}" crossorigin="anonymous" 
                               onerror="this.style.display='none';this.parentElement.querySelector('.fallback-text').style.display='block';">` +
                        `<span class="fallback-text" style="display:none;">${shortLabel}</span>`;
                }

                header.innerHTML = `
                        <div class="logo-icon${logoClass}">${logoHtml}</div>
                        <span class="uni-name-text">${uni.name}</span>
                        ${uni.type === 'branch' ? '<span class="branch-badge">филиал</span>' : ''}
                        <span class="toggle-btn">▸</span>
                    `;

                header.addEventListener('click', function(e) {
                    if (e.target.classList.contains('toggle-btn')) return;
                    selectUniversity(uni.id);
                });

                const toggleBtn = header.querySelector('.toggle-btn');
                toggleBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (selectedUniId === uni.id) {
                        wrapper.classList.toggle('expanded');
                    } else {
                        selectUniversity(uni.id);
                        setTimeout(() => {
                            wrapper.classList.toggle('expanded');
                        }, 50);
                    }
                });

                wrapper.appendChild(header);

                const campusBlock = document.createElement('div');
                campusBlock.className = 'campus-list';

                if (uni.campuses && uni.campuses.length > 0) {
                    uni.campuses.forEach(campus => {
                        const item = document.createElement('div');
                        item.className = 'campus-item';
                        const firstLogo = campus.subdivisions && campus.subdivisions.length > 0 && campus
                            .subdivisions[0].logo ?
                            campus.subdivisions[0].logo :
                            null;
                        let iconHtml = `<span class="fallback-text">🏛</span>`;
                        if (firstLogo) {
                            iconHtml =
                                `<img src="${firstLogo}" alt="logo" crossorigin="anonymous"
                                       onerror="this.style.display='none';this.parentElement.querySelector('.fallback-text').style.display='block';">` +
                                `<span class="fallback-text" style="display:none;">🏛</span>`;
                        }
                        item.innerHTML = `
                                <div class="campus-icon">${iconHtml}</div>
                                <span class="campus-name">${campus.name}</span>
                            `;
                        item.addEventListener('click', function(e) {
                            e.stopPropagation();
                            focusCampus(campus);
                        });
                        campusBlock.appendChild(item);
                    });
                } else {
                    const msg = document.createElement('div');
                    msg.className = 'no-campuses';
                    msg.textContent = 'Нет информации о корпусах данного вуза :(';
                    campusBlock.appendChild(msg);
                }

                wrapper.appendChild(campusBlock);
                uniList.appendChild(wrapper);
            });

            // ---------- ПОИСК ----------
            function filterUniversities(query) {
                const searchTerm = query.toLowerCase().trim();
                uniWrappers.forEach(({ wrapper, uni }) => {
                    if (uni.name.toLowerCase().includes(searchTerm)) {
                        wrapper.classList.remove('hidden');
                    } else {
                        wrapper.classList.add('hidden');
                    }
                });
            }

            searchInput.addEventListener('input', function() {
                filterUniversities(this.value);
            });

            // ---------- ЗАПУСК КАРТЫ ----------
            const colors = applyInitialGradient();
            initMarkers(colors.dark, colors.main, colors.light);
            updateMarkerColors(colors.dark, colors.main, colors.light);

            function updateMarkerColors(dark, main, light) {
                universities.forEach(uni => {
                    const icon = createCustomIcon(uni, dark, main, light);
                    if (markers[uni.id]) markers[uni.id].setIcon(icon);
                });

                if (campusMarkers['igu']) {
                    const newGroup = L.layerGroup();
                    const iguData = universities.find(u => u.id === 'igu');
                    if (iguData && iguData.campuses) {
                        iguData.campuses.forEach(c => {
                            const icon = createCampusIcon(c);
                            const newLayer = L.marker([c.lat, c.lng], { icon });
                            const oldLayer = campusMarkersMap[c.lat.toFixed(6) + ',' + c.lng.toFixed(6)];
                            if (oldLayer && oldLayer.getPopup()) {
                                newLayer.bindPopup(oldLayer.getPopup().getContent());
                            } else {
                                let popupHtml = `<b>${c.name}</b><br><span style="color:#a8d8ea;">${c.address}</span>`;
                                if (c.subdivisions && c.subdivisions.length > 0) {
                                    popupHtml +=
                                        '<br><br><span style="font-weight:bold;color:#a8d8ea;">Подразделения:</span>';
                                    c.subdivisions.forEach(sub => {
                                        const logoHtml = sub.logo ?
                                            `<img src="${sub.logo}" alt="${sub.name}" style="width:24px;height:24px;border-radius:50%;object-fit:contain;background:#0a0f1a;border:1px solid #414d63;">` :
                                            `<span style="display:inline-block;width:24px;height:24px;"></span>`;
                                        popupHtml += `<div style="display:flex;align-items:center;gap:8px;margin:4px 0;">
                                                ${logoHtml}
                                                <span style="color:#a8d8ea;">${sub.name}</span>
                                            </div>`;
                                    });
                                }
                                newLayer.bindPopup(popupHtml);
                            }
                            newGroup.addLayer(newLayer);
                            const key = c.lat.toFixed(6) + ',' + c.lng.toFixed(6);
                            campusMarkersMap[key] = newLayer;
                        });
                    }
                    map.removeLayer(campusMarkers['igu']);
                    campusMarkers['igu'] = newGroup;
                    if (activeUniId === 'igu') map.addLayer(campusMarkers['igu']);
                }
            }

            window.selectUniversity = selectUniversity;
            updateInfoPanel(null);

            // ---------- МОДАЛЬНОЕ ОКНО КОМАНДЫ ----------
            const teamTrigger = document.getElementById('teamTrigger');
            const modalTeam = document.getElementById('modalTeam');
            const closeModalBtn = document.getElementById('closeModalBtn');

            function positionModalAbove(anchor) {
                const rect = anchor.getBoundingClientRect();
                const modalWidth = modalTeam.offsetWidth || 260;
                const modalHeight = modalTeam.offsetHeight || 180;

                let top = rect.top - modalHeight - 10;
                let left = rect.left + rect.width / 2 - modalWidth / 2;

                // Коррекция, чтобы не вылезало за экран
                if (top < 10) top = 10;
                if (left < 10) left = 10;
                if (left + modalWidth > window.innerWidth - 10) {
                    left = window.innerWidth - modalWidth - 10;
                }

                modalTeam.style.top = top + 'px';
                modalTeam.style.left = left + 'px';
            }

            function openTeamModal(e) {
                e.stopPropagation();
                modalTeam.style.display = 'block';
                positionModalAbove(teamTrigger);
            }

            function closeTeamModal() {
                modalTeam.style.display = 'none';
            }

            teamTrigger.addEventListener('click', openTeamModal);
            closeModalBtn.addEventListener('click', closeTeamModal);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalTeam.style.display === 'block') {
                    closeTeamModal();
                }
            });

            window.addEventListener('resize', function() {
                if (modalTeam.style.display === 'block') {
                    positionModalAbove(teamTrigger);
                }
            });

            // Клик вне модалки и вне триггера — закрываем
            document.addEventListener('click', function(e) {
                if (modalTeam.style.display === 'block') {
                    if (!teamTrigger.contains(e.target) && !modalTeam.contains(e.target)) {
                        closeTeamModal();
                    }
                }
            });

        })();
    </script>
</body>
</html>
